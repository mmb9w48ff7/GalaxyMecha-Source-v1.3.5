<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10142B">
<title>宇宙银河机甲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
/* 页面外框（信箱区域、设置面板）随系统明暗切换；游戏画面内的 HUD 固定为深色太空风格 */
:root {
  color-scheme: light;
  --chrome-bg: #C9CEDD;
  --chrome-fg: #1A2046;
  --chrome-panel: #EEF0F6;
  --chrome-line: #A9B0C6;
  --space: #10142B;
  --panel: rgba(24, 30, 66, 0.9);
  --panel-solid: #181E42;
  --panel-hi: #34407A;
  --panel-lo: #090C22;
  --amber: #F5A524;
  --amber-hi: #FFD27A;
  --amber-lo: #A86A06;
  --amber-ink: #2A1A00;
  --teal: #5CF2DC;
  --danger: #E0458C;
  --hp: #7CF29A;
  --bone: #EDE6D6;
  --muted: #A3ABCF;
  --display: "ZCOOL QingKe HuangYou", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --chrome-bg: #05060F;
    --chrome-fg: #EDE6D6;
    --chrome-panel: #151A38;
    --chrome-line: #2C3566;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --chrome-bg: #05060F;
  --chrome-fg: #EDE6D6;
  --chrome-panel: #151A38;
  --chrome-line: #2C3566;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; height: 100%; background: var(--chrome-bg); color: var(--chrome-fg); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#safe-probe { position: absolute; visibility: hidden; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#stage { position: absolute; overflow: hidden; background: var(--space); touch-action: none; }
#stage.emu { border-radius: 28px; box-shadow: 0 0 0 10px #000, 0 0 0 12px var(--chrome-line), 0 30px 80px rgba(0,0,0,.45); }
#stage.emu-left::after { content: ""; position: absolute; left: 0; top: 50%; width: 3.2%; height: 34%; transform: translateY(-50%); background: #000; border-radius: 0 22px 22px 0; z-index: 30; pointer-events: none; }
#stage.emu-hole::after { content: ""; position: absolute; left: 2.2%; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); background: #000; border-radius: 50%; z-index: 30; pointer-events: none; }
#gl { position: absolute; inset: 0; display: block; }
#nogl[hidden], #toast[hidden], #setpanel[hidden] { display: none; }
#nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--bone); font-size: 16px; line-height: 1.6; }

/* ---------- 设计分辨率容器：1920x1080 为基准，按短边等比缩放 ---------- */
#ui { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; color: var(--bone); font-family: var(--body); font-size: 30px; line-height: 1.4;
  --safe-l: 0px; --safe-r: 0px; --safe-t: 0px; --safe-b: 0px; --pad: 36px; }
#ui button, #ui .panel { pointer-events: auto; }
#ui button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
#ui button:focus-visible { outline: 4px solid var(--teal); outline-offset: 4px; }
.unused-safe::before { content: ""; position: absolute; left: var(--safe-l); right: var(--safe-r); top: var(--safe-t); bottom: var(--safe-b); border: 4px dashed rgba(92,242,220,.7); z-index: 50; pointer-events: none; }

/* 体素风面板：切角 + 上亮下暗的厚边，像一块被照亮的方块 */
.panel { position: absolute; background: var(--panel); border-top: 5px solid var(--panel-hi); border-left: 5px solid var(--panel-hi); border-right: 5px solid var(--panel-lo); border-bottom: 7px solid var(--panel-lo);
  clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px); }
.pix { display: block; image-rendering: pixelated; }
.tag { display: inline-block; font-size: 24px; padding: 2px 14px; background: var(--panel-hi); color: var(--bone); font-weight: 700; }
.tag.danger { background: var(--danger); color: #fff; }
.tag.shard { background: var(--teal); color: #062A27; }

.topbar { position: absolute; left: calc(var(--safe-l) + var(--pad)); right: calc(var(--safe-r) + var(--pad)); top: calc(var(--safe-t) + 28px); display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
.brand { display: flex; flex-direction: column; text-shadow: 0 4px 0 rgba(0,0,0,.45); }
.brand-t { font-family: var(--display); font-size: 76px; line-height: 1; color: var(--amber); letter-spacing: 4px; }
.brand-s { font-size: 28px; color: var(--muted); margin-top: 6px; }
.tabs { display: flex; gap: 0; pointer-events: auto; background: var(--panel-lo); padding: 6px; }
.tab { min-height: 96px; padding: 0 34px; font-size: 32px; font-weight: 700; color: var(--muted) !important; }
.tab.on { background: var(--amber) !important; color: var(--amber-ink) !important; box-shadow: inset 0 5px 0 var(--amber-hi), inset 0 -7px 0 var(--amber-lo); }
.res-bar { display: flex; gap: 14px; }
.res-chip { display: flex; align-items: center; gap: 14px; background: var(--panel); padding: 10px 22px 10px 14px; border-bottom: 6px solid var(--panel-lo); border-top: 4px solid var(--panel-hi); min-height: 96px; }
.res-chip div { display: flex; flex-direction: column; line-height: 1.1; }
.res-name { font-size: 22px; color: var(--muted); }
.res-val { font-family: var(--display); font-size: 42px; font-weight: 400; }
.res-chip.is-shard .res-val { color: var(--teal); }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 18px); margin: 0; max-width: 1100px; text-align: center; font-size: 24px; color: var(--muted); text-shadow: 0 2px 0 #000; }

/* ---------- 图鉴 ---------- */
.gallery-list { left: calc(var(--safe-l) + var(--pad)); top: calc(var(--safe-t) + 170px); bottom: calc(var(--safe-b) + 80px); width: 540px; display: flex; flex-direction: column; padding: 18px; }
.cats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.cat { min-height: 76px; padding: 0 20px; font-size: 28px; font-weight: 700; background: var(--panel-lo) !important; color: var(--muted) !important; }
.cat small { font-size: 20px; margin-left: 8px; opacity: .8; }
.cat.on { background: var(--teal) !important; color: #062A27 !important; }
.list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 6px; overscroll-behavior: contain; }
.list::-webkit-scrollbar { width: 10px; } .list::-webkit-scrollbar-thumb { background: var(--panel-hi); }
.row { display: flex; align-items: center; gap: 20px; min-height: 104px; padding: 10px 16px; text-align: left; background: rgba(9,12,34,.55) !important; }
.row.on { background: var(--panel-hi) !important; box-shadow: inset 8px 0 0 var(--amber); }
.row-ic { width: 76px; height: 84px; display: grid; place-items: center; flex: none; }
.row-ic svg { max-width: 76px; max-height: 84px; width: auto; height: auto; }
.row-t { font-size: 30px; font-weight: 700; }
.info { right: calc(var(--safe-r) + var(--pad)); bottom: calc(var(--safe-b) + 80px); width: 660px; padding: 30px 36px 34px; }
.info h1 { font-family: var(--display); font-weight: 400; font-size: 72px; line-height: 1.05; margin: 14px 0 10px; color: var(--bone); }
.info .desc { margin: 0 0 20px; font-size: 28px; line-height: 1.55; color: #D2D6EA; }
.info dl { display: flex; gap: 34px; margin: 0 0 20px; }
.info dt { font-size: 22px; color: var(--muted); }
.info dd { margin: 0; font-family: var(--display); font-size: 38px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatches i { width: 34px; height: 34px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.28), inset 0 4px 0 rgba(255,255,255,.18); }


.gal-back { position: absolute; right: calc(var(--safe-r) + var(--pad)); top: calc(var(--safe-t) + 28px); min-height: 96px; padding: 0 40px; flex: none; }
.btn { min-height: 104px; padding: 0 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; background: var(--panel-hi) !important; box-shadow: inset 0 5px 0 rgba(255,255,255,.12), inset 0 -8px 0 var(--panel-lo); }
.btn small { font-size: 22px; font-weight: 400; opacity: .85; }
.btn.primary { background: var(--amber) !important; color: var(--amber-ink) !important; box-shadow: inset 0 5px 0 var(--amber-hi), inset 0 -8px 0 var(--amber-lo); }
.btn:active, .abtn.down { transform: translateY(4px); }
.mini { min-height: 64px; padding: 0 20px; font-size: 26px; font-weight: 700; background: var(--amber) !important; color: var(--amber-ink) !important; box-shadow: inset 0 -5px 0 var(--amber-lo); }
.mini.alt { background: var(--panel-hi) !important; color: var(--bone) !important; box-shadow: inset 0 -5px 0 var(--panel-lo); }
.mini[disabled] { opacity: .4; }
.note { color: var(--muted); font-size: 26px; margin: 18px 0 0; }

.bar { height: 16px; background: var(--panel-lo); margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--hp); }
/* 标题 */
.title { position: absolute; left: calc(var(--safe-l) + 120px); top: 50%; transform: translateY(-50%); max-width: 860px; }
.title h1 { font-family: var(--display); font-weight: 400; font-size: 190px; line-height: 1; margin: 0; color: var(--amber); letter-spacing: 10px; text-shadow: 0 10px 0 rgba(0,0,0,.45); }
.title .sub { font-size: 34px; line-height: 1.6; margin: 24px 0 48px; color: var(--bone); text-shadow: 0 2px 0 #000; }
.title-btns { display: flex; gap: 20px; flex-wrap: wrap; }
.title-btns .btn { min-width: 300px; }

/* 飞行 HUD */
.h-status { left: calc(var(--safe-l) + var(--pad)); top: calc(var(--safe-t) + 28px); width: 500px; padding: 18px 24px 20px; }
.h-row { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 14px; margin-bottom: 8px; }
.h-lab { font-size: 24px; color: var(--muted); }
.h-row .bar { margin: 0; height: 22px; }
.bar.sh i { background: #57B8FF; } .bar.hp i { background: var(--hp); } .bar.bo i { background: var(--amber); }
.h-meta { display: flex; gap: 22px; align-items: center; margin-top: 6px; font-size: 26px; }
.h-meta span { display: flex; align-items: center; gap: 8px; }
.h-meta b { font-family: var(--display); font-weight: 400; font-size: 36px; }
.h-sd b { color: var(--teal); }
.h-obj { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 26px); width: 760px; text-align: center; text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); pointer-events: none; }
.h-sys { display: block; font-family: var(--display); font-weight: 400; font-size: 46px; color: var(--amber); }
.h-mis { font-size: 26px; color: var(--bone); }
.h-target { left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 150px); width: 460px; padding: 12px 22px 16px; text-align: center; pointer-events: none !important; }
.h-target b { font-size: 30px; display: block; } .h-target span { font-size: 24px; color: var(--muted); }
.h-target .bar.tsh i { background: #57B8FF; } .h-target .bar.thp i { background: var(--danger); }
.h-target.nav .bar { display: none; }
.h-menu { position: absolute; right: calc(var(--safe-r) + var(--pad) + 300px); top: calc(var(--safe-t) + 28px); display: flex; gap: 12px; }
.sbtn { min-height: 88px; padding: 0 26px; font-size: 28px; font-weight: 700; background: var(--panel) !important; box-shadow: inset 0 4px 0 var(--panel-hi), inset 0 -6px 0 var(--panel-lo); }
.throttle { position: absolute; left: calc(var(--safe-l) + var(--pad)); top: 330px; bottom: calc(var(--safe-b) + 120px); width: 104px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
.thr-lab { font-size: 24px; color: var(--muted); }
.thr-track { position: relative; flex: 1; width: 60px; background: rgba(9,12,34,.75); box-shadow: inset 0 0 0 4px var(--panel-hi); pointer-events: auto; touch-action: none; }
.thr-fill { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--amber); opacity: .8; max-height: calc(100% - 16px); }
.thr-knob { position: absolute; left: -14px; right: -14px; height: 36px; background: var(--bone); box-shadow: inset 0 -6px 0 #9a9384; }
.joyzone { position: absolute; left: calc(var(--safe-l) + 170px); bottom: 0; width: 760px; height: 640px; pointer-events: auto; touch-action: none; }
.joy-base, .joy-knob { position: absolute; left: 230px; top: 380px; margin: -130px 0 0 -130px; width: 260px; height: 260px; background: rgba(9,12,34,.45); box-shadow: inset 0 0 0 6px rgba(163,171,207,.45); pointer-events: none; }
.joy-knob { margin: -60px 0 0 -60px; width: 120px; height: 120px; background: rgba(237,230,214,.55); box-shadow: inset 0 -8px 0 rgba(0,0,0,.25); }
.joyzone.on .joy-base { box-shadow: inset 0 0 0 6px var(--teal); }
.actpad { position: absolute; right: calc(var(--safe-r) + var(--pad)); bottom: calc(var(--safe-b) + 40px); width: 560px; height: 470px; }
.abtn { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; touch-action: none; user-select: none; -webkit-user-select: none;
  background: rgba(24,30,66,.85) !important; box-shadow: inset 0 5px 0 var(--panel-hi), inset 0 -8px 0 var(--panel-lo); }
.abtn small { font-family: var(--display); font-size: 30px; font-weight: 400; color: var(--teal); }
.abtn.fire { right: 0; bottom: 0; width: 250px; height: 250px; font-size: 42px; background: var(--danger) !important; color: #fff !important; box-shadow: inset 0 6px 0 #FF8CBE, inset 0 -10px 0 #8E1F55; }
.abtn.missile { right: 270px; bottom: 0; width: 150px; height: 150px; }
.abtn.boost { right: 0; bottom: 270px; width: 150px; height: 150px; }
.abtn.tgt { right: 270px; bottom: 170px; width: 150px; height: 110px; }
.abtn.auto { right: 170px; bottom: 300px; width: 150px; height: 110px; }
.abtn.auto.on { background: var(--teal) !important; color: var(--tealInk, #062A27) !important; }
.interact { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 150px); min-width: 520px; }
.interact:active { transform: translateX(-50%) translateY(4px); }

/* 星港 */
.st-head { position: absolute; left: calc(var(--safe-l) + var(--pad)); right: calc(var(--safe-r) + var(--pad)); top: calc(var(--safe-t) + 26px); display: flex; justify-content: space-between; align-items: center; text-shadow: 0 3px 0 rgba(0,0,0,.5); }
.st-head h1 { font-family: var(--display); font-weight: 400; font-size: 76px; margin: 0; line-height: 1; color: var(--amber); }
.st-head span { font-size: 26px; color: var(--muted); }
.st-res { display: flex; gap: 14px; }
.st-res > span { display: flex; align-items: center; gap: 10px; background: var(--panel); padding: 10px 22px 10px 14px; box-shadow: inset 0 4px 0 var(--panel-hi), inset 0 -6px 0 var(--panel-lo); }
.st-res b { font-family: var(--display); font-weight: 400; font-size: 40px; color: var(--bone); }
.st-res .is-shard b { color: var(--teal); }
.st-nav { position: absolute; left: calc(var(--safe-l) + var(--pad)); top: calc(var(--safe-t) + 160px); bottom: calc(var(--safe-b) + 40px); width: 300px; display: flex; flex-direction: column; gap: 12px; }
.st-tab { min-height: 104px; font-size: 34px; font-weight: 700; text-align: left; padding: 0 30px !important; background: var(--panel) !important; color: var(--muted) !important; box-shadow: inset 0 4px 0 var(--panel-hi), inset 0 -6px 0 var(--panel-lo); }
.st-tab.on { background: var(--teal) !important; color: #062A27 !important; box-shadow: inset 0 4px 0 #B8FFF4, inset 0 -6px 0 #2E9FA6; }
.st-launch { margin-top: auto; }
.st-body { left: calc(var(--safe-l) + var(--pad) + 330px); right: calc(var(--safe-r) + var(--pad)); top: calc(var(--safe-t) + 160px); bottom: calc(var(--safe-b) + 40px); padding: 28px 34px; overflow-y: auto; overscroll-behavior: contain; }
.tbl { width: 100%; border-collapse: collapse; font-size: 30px; }
.tbl th { text-align: left; font-size: 24px; color: var(--muted); font-weight: 400; padding: 0 12px 12px; }
.tbl td { padding: 14px 12px; border-top: 3px solid rgba(52,64,122,.6); vertical-align: middle; }
.tbl td b { font-size: 32px; } .tbl td small { display: block; font-size: 22px; color: var(--muted); }
.tbl em { font-style: normal; font-size: 20px; padding: 2px 8px; margin-left: 10px; vertical-align: 4px; }
.tbl em.cheap { background: var(--hp); color: #0B2A14; } .tbl em.dear { background: var(--amber); color: var(--amber-ink); }
.tbl .ops { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.mis-list { display: flex; flex-direction: column; gap: 18px; }
.mis { background: rgba(9,12,34,.6); padding: 20px 26px; box-shadow: inset 6px 0 0 var(--panel-hi); }
.mis.story { box-shadow: inset 6px 0 0 var(--teal); } .mis.active { box-shadow: inset 6px 0 0 var(--amber); }
.mis h2 { font-size: 38px; margin: 10px 0 6px; } .mis p { margin: 0 0 12px; color: #D2D6EA; font-size: 28px; }
.mis-foot { display: flex; justify-content: space-between; align-items: center; gap: 20px; font-size: 26px; color: var(--amber); }
.yard { display: grid; grid-template-columns: 1.3fr 1fr; gap: 34px; }
.yard h2 { font-size: 34px; margin: 0 0 14px; color: var(--amber); }
.shiprow, .eqrow { display: flex; align-items: center; gap: 20px; padding: 16px 18px; margin-bottom: 12px; background: rgba(9,12,34,.6); }
.shiprow.own { box-shadow: inset 6px 0 0 var(--amber); }
.shiprow > div, .eqrow > div { flex: 1; min-width: 0; }
.shiprow b, .eqrow b { font-size: 32px; } .shiprow small, .eqrow small { display: block; font-size: 22px; color: var(--muted); }
.shiprow .ic { width: 130px; flex: none; display: grid; place-items: center; }
.crew-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.crewcard { display: flex; gap: 16px; align-items: center; padding: 16px; background: rgba(9,12,34,.6); min-height: 210px; }
.crewcard .ic { width: 100px; flex: none; display: grid; place-items: center; }
.crewcard b { display: block; font-size: 36px; } .crewcard span { color: var(--teal); font-size: 26px; } .crewcard small { display: block; font-size: 24px; color: #D2D6EA; margin-top: 6px; }
.crewcard.locked { opacity: .55; } .crewcard .q { font-style: normal; font-family: var(--display); font-size: 90px; color: var(--muted); }
.summon-bar { display: flex; align-items: center; justify-content: space-between; gap: 30px; margin-top: 24px; font-size: 28px; }
.summon-bar p { margin: 0; color: #D2D6EA; } .summon-bar .btn { min-width: 300px; }
.reveal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,6,15,.82); pointer-events: auto; z-index: 5; }
.reveal-in { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; animation: pop .5s ease-out; }
.reveal-in h1 { font-family: var(--display); font-weight: 400; font-size: 120px; margin: 0; line-height: 1; color: var(--bone); }
.reveal-in .role { color: var(--teal); font-size: 34px; } .reveal-in p { font-size: 32px; margin: 0 0 20px; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

/* 星图 / 暂停 */
.mapview { left: calc(var(--safe-l) + var(--pad)); right: calc(var(--safe-r) + var(--pad)); top: calc(var(--safe-t) + 40px); bottom: calc(var(--safe-b) + 40px); display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; padding: 30px 40px; }
.mapview h2 { font-size: 40px; margin: 0 0 16px; color: var(--amber); }
.galaxy { width: 100%; height: 560px; background: rgba(9,12,34,.6); }
.galaxy line { stroke: rgba(163,171,207,.5); stroke-width: 0.025; stroke-dasharray: 0.06 0.04; }
.galaxy text { fill: var(--bone); font-size: 0.13px; text-anchor: middle; font-family: var(--body); }
.galaxy text.here { fill: var(--amber); font-size: 0.1px; }
.map-r { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.navrow { display: flex; justify-content: space-between; align-items: center; min-height: 96px; padding: 0 26px !important; font-size: 30px; background: rgba(9,12,34,.6) !important; box-shadow: inset 6px 0 0 var(--panel-hi); }
.navrow span { color: var(--muted); font-size: 26px; }
.mline { font-size: 28px; color: var(--amber); }
.pausebox { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 900px; padding: 40px 50px; display: flex; flex-direction: column; gap: 20px; }
